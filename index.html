
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveConnect - Find Your Match</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff5f7;
  color:#333;
}
header{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  color:white;
  text-align:center;
  padding:35px 20px;
}
header h1{margin:0;font-size:40px}
header p{font-size:18px}
.container{
  max-width:1000px;
  margin:30px auto;
  padding:20px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}
.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
  text-align:center;
  padding-bottom:25px;
}
.card img{
  width:100%;
  height:300px;
  object-fit:cover;
}
.card h2{margin:18px 0 8px}
.card p{color:#666}
.btn{
  display:inline-block;
  background:#ff416c;
  color:white;
  padding:12px 25px;
  border-radius:25px;
  text-decoration:none;
  margin-top:10px;
}
footer{
  text-align:center;
  padding:30px;
  margin-top:40px;
  background:#222;
  color:white;
}
</style>
</head>

<body>

<header>
  <h1>❤️ LoveConnect</h1>
  <p>Meet new people and discover your perfect match</p>
</header>

<div class="container">
  <h2 style="text-align:center;">Popular Profiles</h2>

  <div class="cards">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1531123897727-8f129e168ce4?auto=format&fit=crop&w=600&q=80" alt="Profile">
      <h2>Emma, 26</h2>
      <p>London • Photographer</p>
      <a class="btn" href="#">View Profile</a>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80" alt="Profile">
      <h2>Sophia, 25</h2>
      <p>Toronto • Designer</p>
      <a class="btn" href="#">View Profile</a>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80" alt="Profile">
      <h2>Olivia, 28</h2>
      <p>New York • Artist</p>
      <a class="btn" href="#">View Profile</a>
    </div>

  </div>
</div>

<footer>
  <p>© 2026 LoveConnect • Connect responsibly and respectfully.</p>
</footer>

</body>
</html>
