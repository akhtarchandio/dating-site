<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveConnect - Find Your Match</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff5f7;
  color:#333;
}

header{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  color:white;
  text-align:center;
  padding:35px 20px;
}

header h1{
  margin:0 0 10px;
  font-size:38px;
}

header p{
  margin:0;
  font-size:18px;
}

.container{
  max-width:1000px;
  margin:30px auto;
  padding:20px;
}

.profiles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:15px;
  padding:25px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.avatar{
  width:100px;
  height:100px;
  margin:auto;
  border-radius:50%;
  background:#ff416c;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.card h2{
  margin:15px 0 5px;
}

.card p{
  color:#777;
}

.button{
  display:inline-block;
  margin-top:15px;
  padding:12px 22px;
  background:#ff416c;
  color:white;
  text-decoration:none;
  border-radius:25px;
  font-weight:bold;
}

.button:hover{
  background:#e93660;
}

footer{
  text-align:center;
  padding:30px;
  color:#888;
}
</style>
</head>

<body>

<header>
  <h1>💕 LoveConnect</h1>
  <p>Find your perfect match and start a new connection.</p>
</header>

<div class="container">

  <div class="profiles">

    <div class="card">
      <div class="avatar">D</div>
      <h2>Daniel</h2>
      <p>Friendly • 27 • New York</p>

      <a class="button"
         href="https://www.profitableratecpmnetwork.com/cbvgxbdcg?key=3a4e058cb023ba1109eea738318c09b7"
         target="_blank"
         rel="nofollow sponsored">
         View Profile
      </a>
    </div>

    <div class="card">
      <div class="avatar">S</div>
      <h2>Sophia</h2>
      <p>Kind • 25 • California</p>

      <a class="button"
         href="https://www.profitableratecpmnetwork.com/cbvgxbdcg?key=3a4e058cb023ba1109eea738318c09b7"
         target="_blank"
         rel="nofollow sponsored">
         View Profile
      </a>
    </div>

    <div class="card">
      <div class="avatar">A</div>
      <h2>Alex</h2>
      <p>Adventurous • 29 • Texas</p>

      <a class="button"
         href="https://www.profitableratecpmnetwork.com/cbvgxbdcg?key=3a4e058cb023ba1109eea738318c09b7"
         target="_blank"
         rel="nofollow sponsored">
         View Profile
      </a>
    </div>

  </div>

</div>

<footer>
  © 2026 LoveConnect • Find meaningful connections
</footer>

</body>
</html>
